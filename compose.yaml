services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://platform:${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}@platform-db:5432/platform?sslmode=disable"
      AMQP_URL: "amqp://platform:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/"
      ASYNC_MIGRATIONS: "${ASYNC_MIGRATIONS:-false}"
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      platform-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
    command: ["-mode=worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://platform:${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}@platform-db:5432/platform?sslmode=disable"
      AMQP_URL: "amqp://platform:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/"
      WORKER_SLOTS: "${WORKER_SLOTS:-4}"
      MIGRATION_BATCH_TIMEOUT: "${MIGRATION_BATCH_TIMEOUT:-5m}"
    depends_on:
      platform-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  platform-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: "${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}"
      POSTGRES_DB: platform
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  target-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: target
      POSTGRES_PASSWORD: "${TARGET_DB_PASSWORD:?Set TARGET_DB_PASSWORD in .env}"
      POSTGRES_DB: target
    volumes:
      - target-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target -d target"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  platform-db-data:
  target-db-data:
  rabbitmq-data:
