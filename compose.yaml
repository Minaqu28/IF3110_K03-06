services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://platform:${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}@platform-db:5432/platform?sslmode=disable"
      AMQP_URL: "amqp://platform:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/"
      ASYNC_MIGRATIONS: "${ASYNC_MIGRATIONS:-true}"
      OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER:-console}"
      OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-none}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      platform-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
    command: ["-mode=worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://platform:${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}@platform-db:5432/platform?sslmode=disable"
      AMQP_URL: "amqp://platform:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/"
      WORKER_SLOTS: "${WORKER_SLOTS:-4}"
      MIGRATION_BATCH_TIMEOUT: "${MIGRATION_BATCH_TIMEOUT:-5m}"
      OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER:-console}"
      OTEL_LOGS_EXPORTER: "${OTEL_LOGS_EXPORTER:-none}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
    depends_on:
      platform-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  platform-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: "${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}"
      POSTGRES_DB: platform
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  target-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: target
      POSTGRES_PASSWORD: "${TARGET_DB_PASSWORD:?Set TARGET_DB_PASSWORD in .env}"
      POSTGRES_DB: target
    volumes:
      - target-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target -d target"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-alpine
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - jaeger
      - loki

  jaeger:
    image: jaegertracing/jaeger:2.3.0
    profiles: [observability]
    ports:
      - "16686:16686"

  loki:
    image: grafana/loki:3.4.2
    profiles: [observability]
    command: ["-config.file=/etc/loki/local-config.yaml"]

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  platform-db-data:
  target-db-data:
  rabbitmq-data:
