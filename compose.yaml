services:
  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgres://platform:${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}@platform-db:5432/platform?sslmode=disable"
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      platform-db:
        condition: service_healthy

  platform-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: "${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}"
      POSTGRES_DB: platform
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  target-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: target
      POSTGRES_PASSWORD: "${TARGET_DB_PASSWORD:?Set TARGET_DB_PASSWORD in .env}"
      POSTGRES_DB: target
    volumes:
      - target-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target -d target"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  platform-db-data:
  target-db-data:
